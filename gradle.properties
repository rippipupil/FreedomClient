# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.11
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Properties
version=0.1.0
group=com.freedomclient
archives_base_name=freedomclient

# Dependencies
fabric_api_version=0.141.6+1.21.11

# Mods de rendimiento integrados (Jar-in-Jar), desde el maven de Modrinth.
# Para ver versiones nuevas: ejecuta el workflow "mod-versions" o ./scripts/mod-versions.sh
sodium_version=mc1.21.11-0.8.14-fabric
lithium_version=mc1.21.11-0.21.4-fabric
ferritecore_version=8.2.0-fabric
immediatelyfast_version=1.14.3+1.21.11-fabric
# Dynamic FPS usa el mismo número de versión para varias versiones de Minecraft,
# así que se fija por el ID de Modrinth (3.11.6 para Fabric 1.21.11).
dynamicfps_version=Fab7e5Th
