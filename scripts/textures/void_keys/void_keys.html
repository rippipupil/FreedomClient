<title>Void Keys</title>
<style>
/* Una sola escena oscura a propósito: el vacío de las referencias (azul noche, luz blanca, esquirlas negras). */
:root {
  --void: #141827;
  --navy: #262c48;
  --steel: #8a93b2;
  --ice: #eef1fa;
  --glow: #ffffff;
  --muted: #9aa3c4;
  --display: "Chakra Petch", "Eurostile", "Arial Narrow", sans-serif;
  --body: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--void); color: var(--ice); font-family: var(--body); overflow: hidden; }
#bg, #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#c { touch-action: none; cursor: grab; }
#c.pix { image-rendering: pixelated; }
header { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px; right: 16px; pointer-events: none; display: grid; gap: 4px; }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(22px, 4vw, 34px); letter-spacing: .32em; margin: 0; text-wrap: balance; }
header p { margin: 0; font-size: 12px; color: var(--muted); max-width: 60ch; }
#now { font-size: 12px; color: var(--ice); min-height: 1.4em; font-variant-numeric: tabular-nums; }
#bar { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; font-size: 12px; padding: 8px 12px; background: rgba(20, 24, 39, .72); color: var(--ice); border: 1px solid var(--steel); cursor: pointer; letter-spacing: .04em; }

  <p>Teclado flotante del vacío: 44 teclas en anillo alrededor del jugador, con olas suaves, líneas de luz que suben y trozos de terreno que suben en espiral; flotando se abalanza al avanzar y, quieto, se deja llevar tranquilo. Arrastra para girar, rueda para acercar.</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================================================
// DISEÑO (lo que pasa al juego tal cual). Unidades: píxeles del modelo de Minecraft (1/16 de
// bloque), y hacia arriba, el jugador en el origen con los pies en y = 0 mirando a +z.
// ============================================================================================
const PAL = {
  cap: 0xf2f3f5,      // tapa de la tecla blanca
  capHi: 0xfcfcfd,    // lomo de la tapa (le da forma redondeada)
  edge: 0xffffff,     // filo de luz del extremo (brilla)
  side: 0xcfd0d5,     // bisel
  body: 0xa2a4ab,     // cuerpo gris claro
  under: 0x6e7077,    // placa de abajo
  shard: 0x3c3d43,    // esquirla gris oscuro
  shardHi: 0x5c5e66,  // cara clara de la esquirla
  black: 0x55575f,    // tecla gris (las "negras")
  blackTop: 0x7a7c84, // cresta de la tecla gris
  line: 0xe6e8ee,     // línea de luz de la tecla gris (brilla)
  mote: 0xf6f7fa,     // línea de luz blanca (brilla)
  trail: 0xb4b8c6,    // cola de la línea de luz (brilla, más tenue)
  rock: 0x2b2d35,     // trozo de terreno oscuro
  rockTop: 0x585b66,  // cara de arriba del trozo, con ceniza
  rockDk: 0x18191e,   // cara en sombra del trozo
  lit: 0xffffff       // tecla encendida
};
const GLOWING = ['edge', 'line', 'mote', 'trail'];

// Cajas [x0, y0, z0, x1, y1, z1, color]: x a lo ancho de la tecla (centrada), y arriba (la tapa
// termina en y = 0), z hacia fuera desde el borde de dentro del anillo.
const WHITE_KEY = [
  // cuerpo gris y tapa blanca con el canto de dentro biselado
  [-1, -1, 0.5, 1, -0.5, 4, 'body'],
  [-1, -0.5, 0.25, 1, 0, 4, 'cap'],
  [-0.75, 0, 0.5, 0.75, 0.125, 3.75, 'capHi'],
  [-1, -0.75, 0, 1, -0.25, 0.25, 'side'],
  // costura de luz a lo largo de la tapa y cara del extremo encendida
  [-0.125, 0.125, 1, 0.125, 0.1875, 3.25, 'edge'],
  [-1, -0.5, 4, 1, 0, 4.25, 'edge'],
  // cristal facetado colgando debajo, como las púas de las referencias
  [-0.5, -1.5, 1.25, 0.5, -1, 2.75, 'under'],
  [-0.375, -2.25, 1.5, 0.375, -1.5, 2.5, 'shard'],
  [-0.25, -3, 1.75, 0.25, -2.25, 2.25, 'shard'],
  [-0.125, -3.75, 1.875, 0.125, -3, 2.125, 'shard'],
  [-0.375, -2.25, 1.5, 0, -1.5, 1.75, 'shardHi']
];
const BLACK_KEY = [
  // prisma gris elevado con la cresta biselada y una línea de luz
  [-0.625, 0, 1.5, 0.625, 0.625, 4, 'black'],
  [-0.375, 0.625, 1.75, 0.375, 0.875, 4, 'blackTop'],
  [-0.125, 0.875, 2.25, 0.125, 0.9375, 3.75, 'line'],
  [-0.625, 0, 4, 0.625, 0.625, 4.125, 'line'],
  // cristalito suelto flotando sobre el extremo
  [-0.25, 1.5, 3.25, 0.25, 2.25, 3.75, 'blackTop'],
  [-0.125, 2.25, 3.375, 0.125, 2.75, 3.625, 'line']
];
// Trozos de terreno oscuro (tres formas): un bloque irregular con la cara de arriba clara, de los que
// suben en espiral alrededor del jugador.
const ROCKS = [
  [[-0.75, -0.5, -0.5, 0.75, 0.25, 0.5, 'rock'], [-0.5, 0.25, -0.5, 0.5, 0.5, 0.25, 'rockTop'],
   [-0.25, -0.75, -0.25, 0.5, -0.5, 0.25, 'rockDk'], [0.75, -0.25, -0.25, 1, 0.25, 0.25, 'rockDk']],
  [[-0.5, -0.5, -0.5, 0.5, 0.25, 0.5, 'rock'], [-0.5, 0.25, -0.25, 0.25, 0.5, 0.5, 'rockTop'],
   [0.5, -0.25, -0.5, 0.75, 0.25, 0, 'rockDk']],
  [[-1, -0.25, -0.5, 0.5, 0.25, 0.5, 'rock'], [-0.75, 0.25, -0.5, 0.25, 0.5, 0.5, 'rockTop'],
   [0.5, -0.25, -0.25, 1, 0, 0.25, 'rock'], [-0.5, -0.5, -0.25, 0, -0.25, 0.25, 'rockDk']]
];
// Línea de luz blanca que sube: un hilo brillante con la cola más tenue (se estira al subir).
const STREAK = [[-0.125, 0, -0.125, 0.125, 2, 0.125, 'mote'], [-0.125, -1.5, -0.125, 0.125, 0, 0.125, 'trail']];

const RING = {
  whites: 26,          // 44 teclas: 26 blancas y 18 grises, de do3 a sol6
  inner: 16,           // radio del borde de dentro: aro amplio, con las teclas algo separadas
  height: 18.5,        // altura de las tapas sobre los pies: justo por debajo del pecho
  spin: 50,            // segundos por vuelta del anillo
  wave: 6,             // segundos por ola
  crests: 2,           // crestas de ola alrededor del anillo
  amp: 0.6,            // altura de la ola
  tilt: 0.08,          // cabeceo de cada tecla con la ola (radianes)
  // teclas grises entre las blancas (do#, re#, fa#, sol#, la# de cada octava; en la última, hasta fa#)
  blacks: [0, 1, 3, 4, 5, 7, 8, 10, 11, 12, 14, 15, 17, 18, 19, 21, 22, 24]
};
const FLOAT = { lift: 3, bob: 0.8, period: 3.2 };

// Nota (0-43, de do3 a sol6) -> tecla del anillo: {white: índice} o {black: índice}.
const WHITE_OF = [0, null, 1, null, 2, 3, null, 4, null, 5, null, 6];
const BLACK_OF = [null, 0, null, 1, null, null, 2, null, 3, null, 4, null];
function noteKey(note) {
  const oct = Math.floor(note / 12), s = note % 12;
  return WHITE_OF[s] !== null ? { white: WHITE_OF[s] + oct * 7 } : { black: BLACK_OF[s] + oct * 5 };
}

// Ángulo de una tecla en el anillo (0 = delante del jugador), sin el giro.
function whiteAngle(i) { return i * 2 * Math.PI / RING.whites; }
function blackAngle(j) { return (RING.blacks[j] + 0.5) * 2 * Math.PI / RING.whites; }

// Pose de una tecla en el tiempo t (segundos): ángulo con el giro, altura con la ola y cabeceo.
function keyPose(angle, t) {
  const phase = 2 * Math.PI * t / RING.wave - RING.crests * angle;
  return {
    angle: angle + 2 * Math.PI * t / RING.spin,
    y: RING.height + RING.amp * Math.sin(phase),
    tilt: RING.tilt * Math.cos(phase)
  };
}

// Números aleatorios repetibles (Park-Miller, semilla 7), como en los otros diseños.
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

// Partículas de ambiente: líneas de luz que suben rectas y deprisa, y trozos de terreno que suben
// despacio en espiral alrededor del jugador (cerrándose al subir) dando tumbos; todo se encoge hasta
// desaparecer arriba.
const STREAKS = 18, ROCK_COUNT = 10, RISE = 32;
const streaks = [], rocks = [];
{
  const r = rng(7);
  for (let i = 0; i < STREAKS; i++) streaks.push({ a: r() * 6.283, rad: 6 + r() * 16, y0: r() * RISE, v: 5 + r() * 4, w: 0, twist: 0, size: 0.7 + r() * 0.6 });
  for (let i = 0; i < ROCK_COUNT; i++) rocks.push({ a: r() * 6.283, rad: 12 + r() * 8, y0: r() * RISE, v: 1.4 + r() * 1.0, w: 0.25 + r() * 0.15, twist: 0.12,
    ax: [r() - 0.5, r() - 0.5, r() - 0.5], spin: 0.5 + r() * 1.0, size: 0.8 + r() * 0.6, shape: i % ROCKS.length });
}
// Estado de una partícula en el tiempo t: posición, tamaño (0 cuando desaparece) y giro.
function particle(p, t) {
  const h = (p.y0 + p.v * t) % RISE;                 // 0..RISE desde abajo
  const life = h / RISE;
  const grow = Math.min(1, h / 3);                   // aparece creciendo
  const fade = 1 - Math.pow(life, 2.2);              // se va encogiendo al subir
  const ang = p.a + p.w * t + p.twist * h;           // la espiral: más vuelta cuanto más arriba
  const rad = p.rad * (1 - 0.35 * life * (p.twist ? 1 : 0));
  return { x: Math.sin(ang) * rad, y: RING.height - 12 + h, z: Math.cos(ang) * rad, s: p.size * grow * fade, rot: (p.spin || 0) * t };
}

// Flotar en tercera persona (como la referencia): subido y meciéndose, la pierna derecha doblada hacia
// atrás, la izquierda colgando un poco adelantada, los brazos abajo algo abiertos y hacia atrás, la
// cabeza un poco ladeada. Ángulos en radianes: piernas y brazos positivos = hacia atrás.
function floatPose(t) {
  const b = Math.sin(2 * Math.PI * t / FLOAT.period);
  return { lift: FLOAT.lift + FLOAT.bob * b,
    rightLeg: 0.55 + 0.06 * b, rightLegOut: 0.06, leftLeg: -0.18 - 0.04 * b, leftLegOut: 0.04,
    armOut: 0.18 + 0.03 * b, armBack: 0.12, headTilt: 0.1, headNod: 0.08,
    // el brazo izquierdo, un poco levantado hacia un lado y adelante (sin llegar a las teclas)
    leftArmUp: 0.5 + 0.04 * b, leftArmForward: -0.3 };
}

// Moverse flotando: se abalanza hacia delante (todo el cuerpo inclinado sobre su centro), el brazo
// derecho levantado hacia delante, el izquierdo atrás, la pierna izquierda estirada atrás y la derecha
// algo detrás; cuanto más rápido, más se inclina. speed: 0 quieto, 1 andando, 1.4 corriendo.
function movePose(speed, t) {
  const k = Math.min(1.4, speed), sway = Math.sin(2 * Math.PI * t / 1.6) * Math.min(1, k);
  // Corriendo se inclina un poco más, pero las piernas de atrás nunca llegan al aro.
  return { k: Math.min(1, k), lean: 0.4 * Math.min(1, k) + 0.1 * Math.max(0, k - 1), rightArm: -2.45 - 0.1 * sway, rightArmOut: -0.12,
    leftArm: 0.5 + 0.1 * sway, leftArmOut: 0.18, rightLeg: 0.3 + 0.08 * sway, leftLeg: 0.62 - 0.08 * sway };
}

// Saltar flotando: subiendo, los dos brazos arriba y las piernas recogidas; cayendo, brazos un poco
// abiertos y piernas colgando hacia atrás. vy: velocidad vertical (bloques por tick, + arriba).
function jumpPose(vy) {
  const up = Math.max(0, Math.min(1, vy / 0.35)), down = Math.max(0, Math.min(1, -vy / 0.35));
  return { up, down, arms: -2.7 * up + 0.1 * down, armsOut: 0.2 * up + 0.5 * down, legs: -0.6 * up + 0.3 * down };
}

// Quieto flotando, ambiente chill: se deja llevar despacio (mira a los lados, se mece) y de vez en
// cuando se echa hacia atrás como tumbado en el aire o se estira con los brazos hacia arriba. Nada
// sale del hueco del aro: las manos y los pies no llegan a las teclas.
const CHILL = { cycle: 36, ramp: 3, recline: [5, 16], stretch: [22, 30] };
function chillPose(t) {
  const c = t % CHILL.cycle;
  const win = ([a, b]) => {
    const s = u => { u = Math.max(0, Math.min(1, u)); return u * u * (3 - 2 * u); };
    return s((c - a) / CHILL.ramp) * s((b - c) / CHILL.ramp);
  };
  return {
    drift: { yaw: 0.35 * Math.sin(2 * Math.PI * t / 14), roll: 0.06 * Math.sin(2 * Math.PI * t / 9), pitch: 0.04 * Math.sin(2 * Math.PI * t / 11) },
    recline: win(CHILL.recline),  // tumbado hacia atrás: cuerpo -0,45, piernas adelante, brazos sueltos abiertos
    stretch: win(CHILL.stretch)   // estirándose: brazos arriba, la cabeza mirando arriba, sube un poco
  };
}

// Pose completa del jugador. o: {t, floating, playing, speed (0-1.4), vy, hand (0/1), handHit (0-1)}.
// Devuelve lo que sube y el giro de todo el cuerpo sobre su centro (16 px), y [x, z] de cada parte
// (radianes; brazos y piernas: x negativo = hacia delante, z hacia fuera con el signo de su lado).
function figurePose(o) {
  const mix = (v, to, k) => v + (to - v) * k;
  const fp = floatPose(o.t);
  const p = { lift: 0, pitch: 0, yaw: 0, roll: 0, head: [0, 0], rArm: [0, -0.05], lArm: [0, 0.05], rLeg: [0, 0], lLeg: [0, 0] };
  if (o.playing) {
    // Tocando: flota, las dos manos sobre las teclas de delante y una baja a cada nota.
    p.lift = fp.lift;
    p.rArm = [-1.0 + (o.hand === 0 ? 0.3 * o.handHit : 0), -0.3];
    p.lArm = [-1.0 + (o.hand === 1 ? 0.3 * o.handHit : 0), 0.3];
    p.head = [0.35, 0];
    p.rLeg = [fp.rightLeg, -fp.rightLegOut]; p.lLeg = [fp.leftLeg, fp.leftLegOut];
    return p;
  }
  if (!o.floating) {
    const s = Math.sin(o.t * 6) * 0.5 * Math.min(1, o.speed + Math.abs(o.vy) * 3);
    p.rLeg = [s, 0]; p.lLeg = [-s, 0]; p.rArm = [-s, -0.05]; p.lArm = [s, 0.05];
    return p;
  }
  p.lift = fp.lift;
  p.rArm = [fp.armBack, -fp.armOut]; p.lArm = [fp.leftArmForward, fp.leftArmUp];
  p.rLeg = [fp.rightLeg, -fp.rightLegOut]; p.lLeg = [fp.leftLeg, fp.leftLegOut];
  p.head = [fp.headNod, fp.headTilt];
  // Quieto: chill (se apaga en cuanto se mueve o salta).
  const idle = Math.max(0, 1 - o.speed * 4) * (1 - Math.min(1, Math.abs(o.vy) * 6));
  if (idle > 0) {
    const c = chillPose(o.t), r = c.recline * idle, st = c.stretch * idle;
    p.yaw += c.drift.yaw * idle; p.roll += c.drift.roll * idle; p.pitch += c.drift.pitch * idle;
    p.pitch -= 0.45 * r;
    p.rLeg = [mix(p.rLeg[0], -0.3, r), p.rLeg[1]]; p.lLeg = [mix(p.lLeg[0], -0.15, r), p.lLeg[1]];
    p.rArm = [mix(p.rArm[0], 0.3, r), mix(p.rArm[1], -0.4, r)]; p.lArm = [mix(p.lArm[0], 0.3, r), mix(p.lArm[1], 0.4, r)];
    p.head[0] = mix(p.head[0], -0.2, r);
    p.rArm = [mix(p.rArm[0], -2.9, st), mix(p.rArm[1], -0.12, st)]; p.lArm = [mix(p.lArm[0], -2.9, st), mix(p.lArm[1], 0.12, st)];
    p.head[0] = mix(p.head[0], -0.3, st);
    // al estirarse se echa un poco hacia atrás, así los brazos suben lejos de las teclas
    p.pitch -= 0.25 * st;
    p.lift += 1 * st;
  }
  // Avanzando: se abalanza con el brazo derecho por delante y las piernas atrás.
  const mp = movePose(o.speed, o.t);
  p.pitch += mp.lean;
  p.rArm = [mix(p.rArm[0], mp.rightArm, mp.k), mix(p.rArm[1], mp.rightArmOut, mp.k)];
  p.lArm = [mix(p.lArm[0], mp.leftArm, mp.k), mix(p.lArm[1], mp.leftArmOut, mp.k)];
  p.rLeg = [mix(p.rLeg[0], mp.rightLeg, mp.k), p.rLeg[1]]; p.lLeg = [mix(p.lLeg[0], mp.leftLeg, mp.k), p.lLeg[1]];
  p.head[0] -= mp.lean * 0.6;
  // Saltando: brazos arriba y piernas recogidas al subir; brazos algo abiertos al caer.
  const jp = jumpPose(o.vy), jw = Math.max(jp.up, jp.down);
  p.rArm = [mix(p.rArm[0], jp.arms, jw), mix(p.rArm[1], -jp.armsOut, jw)];
  p.lArm = [mix(p.lArm[0], jp.arms, jw), mix(p.lArm[1], jp.armsOut, jw)];
  p.rLeg = [mix(p.rLeg[0], jp.legs, jw), p.rLeg[1]]; p.lLeg = [mix(p.lLeg[0], jp.legs + 0.15, jw), p.lLeg[1]];
  return p;
}

// Partitura de "Flow" (timeline.py): [milisegundo, nota, fuerza], 710 notas.
const FLOW = %FLOW%;
const FLOW_LENGTH = 205.3;
</script>

<script>
(function () {
  const canvas = document.getElementById('c');
  const bg = document.getElementById('bg');
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: false });
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(30, 1, 1, 2000);
  scene.add(new THREE.AmbientLight(0xb8c2e8, 0.55));
  const sun = new THREE.DirectionalLight(0xffffff, 0.85); sun.position.set(40, 80, 60); scene.add(sun);
  const back = new THREE.DirectionalLight(0x8090ff, 0.35); back.position.set(-60, -10, -80); scene.add(back);

  const geo = new THREE.BoxGeometry(1, 1, 1);
  const mats = {};
  for (const k in PAL) mats[k] = GLOWING.includes(k) ? new THREE.MeshBasicMaterial({ color: PAL[k] }) : new THREE.MeshLambertMaterial({ color: PAL[k] });
  function build(boxes, own) {
    const g = new THREE.Group();
    for (const b of boxes) {
      const m = new THREE.Mesh(geo, own && (b[6] === 'cap' || b[6] === 'capHi') ? mats[b[6]].clone() : mats[b[6]]);
      m.scale.set(b[3] - b[0], b[4] - b[1], b[5] - b[2]);
      m.position.set((b[0] + b[3]) / 2, (b[1] + b[4]) / 2, (b[2] + b[5]) / 2);
      g.add(m);
    }
    return g;
  }

  const world = new THREE.Group(); scene.add(world);
  // Teclas: cada una en su pivote (el centro del anillo), girada a su ángulo.
  const keys = [];
  function addKey(boxes, angle, white) {
    const pivot = new THREE.Group(); pivot.rotation.order = 'YXZ';
    const k = build(boxes, true); k.position.z = RING.inner; pivot.add(k); world.add(pivot);
    const caps = k.children.filter(m => m.material.type === 'MeshLambertMaterial' && [PAL.cap, PAL.capHi].includes(m.material.color.getHex()));
    keys.push({ pivot, key: k, angle, white, light: 0, caps });
  }
  for (let i = 0; i < RING.whites; i++) addKey(WHITE_KEY, whiteAngle(i), true);
  for (let j = 0; j < RING.blacks.length; j++) addKey(BLACK_KEY, blackAngle(j), false);

  // Jugador de referencia (silueta azulada, sin skin): cabeza, cuerpo, brazos y piernas como en Minecraft.
  // El cuerpo se inclina y se mece sobre su centro (16 px sobre los pies).
  const acro = new THREE.Group(); world.add(acro);
  const fig = new THREE.Group(); fig.position.y = -16; acro.add(fig);
  const figMat = new THREE.MeshLambertMaterial({ color: 0x4a5170 }), headMat = new THREE.MeshLambertMaterial({ color: 0x69718f });
  function part(w, h, d, px, py, pz, ox, oy, mat) {
    const pivot = new THREE.Group(); pivot.position.set(px, py, pz);
    const m = new THREE.Mesh(geo, mat); m.scale.set(w, h, d); m.position.set(ox, oy, 0); pivot.add(m); fig.add(pivot); return pivot;
  }
  const head = part(8, 8, 8, 0, 24, 0, 0, 4, headMat);
  const body = part(8, 12, 4, 0, 18, 0, 0, 0, figMat);
  const rArm = part(4, 12, 4, -6, 22, 0, 0, -4, figMat);
  const lArm = part(4, 12, 4, 6, 22, 0, 0, -4, figMat);
  const rLeg = part(4, 12, 4, -2, 12, 0, 0, -6, figMat);
  const lLeg = part(4, 12, 4, 2, 12, 0, 0, -6, figMat);

  // Partículas.
  const streakMeshes = streaks.map(() => { const g = build(STREAK); world.add(g); return g; });
  const rockMeshes = rocks.map(p => { const g = build(ROCKS[p.shape]); world.add(g); return g; });
  const bursts = []; // destellos al tocar una tecla
  const burstPool = Array.from({ length: 40 }, () => { const g = build(STREAK); g.visible = false; world.add(g); return g; });
  const rockPool = Array.from({ length: 12 }, (_, i) => { const g = build(ROCKS[i % ROCKS.length]); g.visible = false; world.add(g); return g; });

  // Estado de la vista.
  let ry = -0.6, rx = 0.5, dist = 150, spin = true, pix = true, parts = true, floating = true, playing = false, motion = 0, speed = 0;
  let playStart = 0, nextNote = 0, yaw = 0, hand = 0, handHit = 0;
  const now = document.getElementById('now');

  function drawBackground() {
    const w = bg.width = innerWidth, h = bg.height = innerHeight, g = bg.getContext('2d');
    const grd = g.createLinearGradient(0, 0, 0, h); grd.addColorStop(0, '#1a1f33'); grd.addColorStop(1, '#0f1220');
    g.fillStyle = grd; g.fillRect(0, 0, w, h);
    // Luna blanca de las referencias, detrás de todo.
    const cx = w * 0.5, cy = h * 0.58, R = Math.min(w, h) * 0.33;
    const halo = g.createRadialGradient(cx, cy, R * 0.4, cx, cy, R * 1.9);
    halo.addColorStop(0, 'rgba(235,240,255,.55)'); halo.addColorStop(1, 'rgba(235,240,255,0)');
    g.fillStyle = halo; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(244,246,255,.9)'; g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill();
    // Hierba de púas oscuras delante, como en las referencias.
    const r = rng(11);
    for (let i = 0; i < 140; i++) {
      const x = r() * w, base = h * (0.82 + r() * 0.2), tall = h * (0.08 + r() * 0.22), lean = (r() - 0.5) * tall * 0.6, wid = 6 + r() * 16;
      const shade = r() * 18;
      g.fillStyle = `rgba(${24 + shade | 0},${28 + shade | 0},${50 + shade * 1.3 | 0},${0.8 + r() * 0.2})`;
      g.beginPath(); g.moveTo(x - wid, base); g.lineTo(x + lean, base - tall); g.lineTo(x + wid, base); g.fill();
    }
  }
  function size() {
    const w = canvas.clientWidth, h = canvas.clientHeight, k = pix ? 2 : 1 / Math.min(devicePixelRatio || 1, 2);
    renderer.setSize(Math.max(1, Math.floor(w / k)), Math.max(1, Math.floor(h / k)), false);
    cam.aspect = w / h; cam.updateProjectionMatrix();
    canvas.classList.toggle('pix', pix);
    drawBackground();
  }
  addEventListener('resize', size); size();

  let drag = null;
  canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); canvas.style.cursor = 'grabbing'; });
  canvas.addEventListener('pointermove', e => { if (!drag) return; ry += (e.clientX - drag.x) * 0.01; rx = Math.max(-0.2, Math.min(1.3, rx + (e.clientY - drag.y) * 0.01)); drag = { x: e.clientX, y: e.clientY }; });
  const up = () => { drag = null; canvas.style.cursor = 'grab'; };
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('wheel', e => { e.preventDefault(); dist = Math.max(70, Math.min(320, dist * (1 + Math.sign(e.deltaY) * 0.08))); }, { passive: false });
  function toggle(id, fn) { const b = document.getElementById(id); b.onclick = () => { const v = fn(); b.setAttribute('aria-pressed', v); }; }
  toggle('bSpin', () => spin = !spin);
  toggle('bPix', () => { pix = !pix; size(); return pix; });
  toggle('bPart', () => parts = !parts);
  toggle('bFloat', () => floating = !floating);
  const MOVES = ['quieto', 'avanzando', 'saltando'];
  document.getElementById('bMove').onclick = e => { motion = (motion + 1) % 3; e.currentTarget.textContent = 'Movimiento: ' + MOVES[motion]; e.currentTarget.setAttribute('aria-pressed', motion > 0); };
  toggle('bPlay', () => { playing = !playing; playStart = performance.now(); nextNote = 0; now.textContent = playing ? '♪ Flow — Creo (sin sonido en la vista previa: las teclas siguen la partitura)' : ''; return playing; });

  // Al tocar una tecla: unas líneas de luz salen hacia arriba y, en las notas fuertes, un trozo de terreno.
  function spawnBurst(k, t, strength) {
    const p = keyPose(k.angle, t), n = 2 + Math.round(strength * 3);
    for (let i = 0; i < n; i++) {
      const m = burstPool.find(b => !b.visible); if (!m) break;
      const a = p.angle + (Math.random() - 0.5) * 0.2, rad = RING.inner + 1 + Math.random() * 3;
      bursts.push({ m, x: Math.sin(a) * rad, y: p.y + 0.5, z: Math.cos(a) * rad, vx: 0, vy: 10 + Math.random() * 8, vz: 0, age: 0, life: 0.6 + Math.random() * 0.4, rock: false });
      m.visible = true;
    }
    if (strength > 0.55) {
      const m = rockPool.find(b => !b.visible);
      if (m) { const rad = RING.inner + 2; bursts.push({ m, x: Math.sin(p.angle) * rad, y: p.y - 1, z: Math.cos(p.angle) * rad, vx: 0, vy: 3.5, vz: 0, age: 0, life: 1.6, rock: true }); m.visible = true; }
    }
  }

  const t0 = performance.now();
  let last = t0;
  (function loop() {
    const nowMs = performance.now(), t = (nowMs - t0) / 1000, dt = Math.min(0.05, (nowMs - last) / 1000); last = nowMs;
    if (spin && !drag) ry += 0.0035;

    // Teclas: giro del anillo, olas y luz.
    if (playing) {
      const songT = ((nowMs - playStart) / 1000) % FLOW_LENGTH;
      if (nextNote < FLOW.length && FLOW[nextNote][0] / 1000 > songT + 1) nextNote = 0;
      while (nextNote < FLOW.length && FLOW[nextNote][0] / 1000 <= songT) {
        const [ms, note, s] = FLOW[nextNote++];
        const kk = noteKey(note), k = kk.white !== undefined ? keys[kk.white] : keys[RING.whites + kk.black];
        k.light = 1; spawnBurst(k, t, s / 100);
        hand ^= 1; handHit = 1;
        yaw = k.angle + 2 * Math.PI * t / RING.spin; // el jugador se gira hacia la tecla que toca
      }
    }
    for (const k of keys) {
      const p = keyPose(k.angle, t);
      k.pivot.rotation.y = p.angle;
      k.pivot.position.y = p.y - k.light * 0.5;
      k.pivot.rotation.x = p.tilt;
      k.light = Math.max(0, k.light - dt / 0.35);
      for (const c of k.caps) c.material.emissive.setRGB(k.light, k.light, k.light);
    }

    // Jugador: la pose sale de figurePose; tocando, además gira hacia la tecla que suena.
    speed += ((motion === 1 ? 1 : 0) - speed) * Math.min(1, dt * 4);
    let jumpY = 0, vy = 0;
    if (motion === 2) {
      const j = (t % 1.8) / 1.8;
      if (j < 0.8) { const u = j / 0.8; jumpY = 9 * Math.sin(Math.PI * u); vy = 0.35 * Math.cos(Math.PI * u); }
    }
    handHit = Math.max(0, handHit - dt / 0.25);
    const fpose = figurePose({ t, floating, playing, speed, vy, hand, handHit });
    acro.position.y = 16 + fpose.lift + jumpY;
    acro.rotation.set(fpose.pitch, fpose.yaw, fpose.roll, 'YXZ');
    rArm.rotation.set(fpose.rArm[0], 0, fpose.rArm[1]); lArm.rotation.set(fpose.lArm[0], 0, fpose.lArm[1]);
    rLeg.rotation.set(fpose.rLeg[0], 0, fpose.rLeg[1]); lLeg.rotation.set(fpose.lLeg[0], 0, fpose.lLeg[1]);
    head.rotation.set(fpose.head[0], 0, fpose.head[1]);
    let figYaw = fig.rotation.y;
    if (playing) { let d = yaw - figYaw; d = Math.atan2(Math.sin(d), Math.cos(d)); figYaw += d * Math.min(1, dt * 6); }
    else figYaw += Math.atan2(Math.sin(-figYaw), Math.cos(-figYaw)) * Math.min(1, dt * 2);
    fig.rotation.y = figYaw;

    // Partículas de ambiente.
    streaks.forEach((p, i) => { const q = particle(p, t), m = streakMeshes[i]; m.visible = parts && q.s > 0.02; m.position.set(q.x, q.y, q.z); m.scale.set(1, q.s, 1); });
    rocks.forEach((p, i) => {
      const q = particle(p, t), m = rockMeshes[i]; m.visible = parts && q.s > 0.02; m.position.set(q.x, q.y, q.z); m.scale.setScalar(q.s);
      m.setRotationFromAxisAngle(new THREE.Vector3(...p.ax).normalize(), q.rot);
    });
    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i]; b.age += dt;
      if (b.age >= b.life) { b.m.visible = false; bursts.splice(i, 1); continue; }
      b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt; b.vy *= 0.97;
      const f = 1 - b.age / b.life;
      b.m.position.set(b.x, b.y, b.z);
      if (b.rock) { b.m.scale.setScalar(f); b.m.rotation.y += dt * 2; b.m.rotation.x += dt * 1.3; } else b.m.scale.set(1, 1.3 * f, 1);
    }

    world.rotation.set(rx, ry, 0);
    world.position.y = -14;
    const fit = cam.aspect < 0.8 ? 0.8 / cam.aspect : 1;
    cam.position.set(0, 0, dist * fit); cam.lookAt(0, 0, 0);
    renderer.render(scene, cam);
    requestAnimationFrame(loop);
  })();
})();
</script>
