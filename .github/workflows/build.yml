name: build

on:
  push:
    branches-ignore:
      - ci-screenshots
      - ci-probe
      - ci-launcher
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Show Fabric Loader requirements of bundled mods
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          mkdir -p /tmp/nested && cd /tmp/nested && unzip -q -o "$GITHUB_WORKSPACE/$jar" 'META-INF/jars/*'
          for nested in META-INF/jars/*.jar; do
            echo "$(basename "$nested"): $(unzip -p "$nested" fabric.mod.json | tr -d '\n\t ' | grep -o '"fabricloader":"[^"]*"' || echo 'no loader requirement')"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: freedomclient
          path: build/libs/*.jar
      # Publica el .jar en la release "latest" para poder descargarlo directamente desde GitHub.
      - name: Publish the jar to the latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          cp "$jar" /tmp/FreedomClient-1.21.11.jar
          notes="Última versión de FreedomClient para Minecraft 1.21.11 (compilada desde ${GITHUB_SHA::7}, rama ${GITHUB_REF_NAME}).

          Instalación: instala Fabric Loader para Minecraft 1.21.11 y pon FreedomClient-1.21.11.jar en la carpeta .minecraft/mods. Fabric API y los mods de rendimiento ya van dentro."
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          if gh release view latest > /dev/null 2>&1; then
            gh release edit latest --title "FreedomClient (última versión)" --notes "$notes" --prerelease
          else
            gh release create latest --title "FreedomClient (última versión)" --notes "$notes" --prerelease --verify-tag
          fi
          gh release upload latest /tmp/FreedomClient-1.21.11.jar --clobber
