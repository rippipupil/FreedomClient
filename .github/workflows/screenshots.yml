name: screenshots

# Abre el juego en una pantalla virtual, ejecuta los tests de cliente y publica las capturas
# en la rama "ci-screenshots" para poder revisar el diseño del menú sin abrir Minecraft.
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - ci-screenshots
    paths:
      - src/**
      - build.gradle
      - gradle.properties
      - .github/workflows/screenshots.yml

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Run client game tests
        timeout-minutes: 15
        # Loom ya lanza el juego dentro de xvfb cuando detecta CI.
        run: ./gradlew runProductionClientGameTest --stacktrace 2>&1 | tee /tmp/gametest-output.txt; exit ${PIPESTATUS[0]}
      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p /tmp/shots
          find . -path ./.git -prune -o -name '*.png' -path '*screenshots*' -print -exec cp {} /tmp/shots/ \;
          find . -path ./.git -prune -o -name 'latest.log' -print -exec cp {} /tmp/shots/latest.log \;
          find . -path ./.git -prune -o -path '*crash-reports*' -name '*.txt' -print -exec cp {} /tmp/shots/ \;
          find . -path ./.git -prune -o -name 'hs_err_pid*.log' -print -exec cp {} /tmp/shots/ \;
          grep -v -E '^\s+at (org\.gradle|java\.base)' /tmp/gametest-output.txt | tail -400 > /tmp/shots/gametest-output.txt || true
          ls -la /tmp/shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: /tmp/shots
      - name: Publish screenshots branch
        if: always()
        run: |
          cd /tmp/shots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Screenshots from ${GITHUB_SHA} (${GITHUB_REF_NAME})" > README.md
          git add -A
          git commit -q -m "Screenshots from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
