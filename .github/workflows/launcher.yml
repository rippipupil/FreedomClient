name: launcher

# Launcher de FreedomClient (Rust + Tauri):
# - En Linux instala Minecraft 1.21.11 + Fabric + FreedomClient desde cero con el núcleo del launcher
#   y lanza el juego en una pantalla virtual.
# - En Windows compila la app, la abre para hacer una captura, prueba la instalación y publica el instalador
#   en la release "launcher". Las capturas y los logs se publican en la rama "ci-launcher".
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - ci-screenshots
      - ci-probe
      - ci-launcher
    paths:
      - launcher/**
      - .github/workflows/launcher.yml

permissions:
  contents: write

concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          mkdir -p /tmp/shots
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri imagemagick
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
      - name: Unit tests
        working-directory: launcher
        run: cargo test -p fc-core
      - name: Install and launch the game with the launcher core
        working-directory: launcher
        env:
          FC_LAUNCHER_HOME: /tmp/fc
          FC_CI_READY_FILE: /tmp/fc-ready
          FC_OFFICIAL_MINECRAFT: /tmp/official-minecraft
        run: |
          mkdir -p /tmp/shots
          set -o pipefail
          cargo build -p fc-core --bin fc-ci
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          ./target/debug/fc-ci 900 2>&1 | tee /tmp/shots/fc-ci.txt &
          CI_PID=$!
          for i in $(seq 1 450); do
            if [ -f /tmp/fc-ready ]; then import -window root /tmp/shots/game.png; break; fi
            if ! kill -0 $CI_PID 2>/dev/null; then break; fi
            sleep 2
          done
          wait $CI_PID
      - name: Collect logs
        if: always()
        run: |
          cp /tmp/fc/instances/ci/logs/latest.log /tmp/shots/ 2>/dev/null || true
          cp /tmp/fc/instances/ci/logs/launcher-output.log /tmp/shots/ 2>/dev/null || true
          cp /tmp/fc/instances/ci/options.txt /tmp/shots/ 2>/dev/null || true
          ls -la /tmp/shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test
          path: /tmp/shots

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
      - name: Build the launcher
        working-directory: launcher/app
        run: npx --yes @tauri-apps/cli@^2 build
      - name: Collect the builds
        shell: bash
        run: |
          mkdir -p dist
          cp launcher/target/release/freedom-launcher.exe dist/FreedomClient-Launcher-Portable.exe
          cp launcher/target/release/bundle/nsis/*-setup.exe dist/FreedomClient-Launcher-Setup.exe
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-windows
          path: dist
      - name: Publish to the launcher release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="FreedomClient Launcher para Windows (compilado desde ${GITHUB_SHA::7}, rama ${GITHUB_REF_NAME}).

          FreedomClient-Launcher-Setup.exe: instalador. FreedomClient-Launcher-Portable.exe: sin instalar (necesita WebView2, que ya viene con Windows 10 y 11)."
          git tag -f launcher "$GITHUB_SHA"
          git push -f origin refs/tags/launcher
          if gh release view launcher > /dev/null 2>&1; then
            gh release edit launcher --title "FreedomClient Launcher" --notes "$notes" --prerelease
          else
            gh release create launcher --title "FreedomClient Launcher" --notes "$notes" --prerelease --verify-tag
          fi
          gh release upload launcher dist/FreedomClient-Launcher-Setup.exe dist/FreedomClient-Launcher-Portable.exe --clobber

      - name: Open the launcher and take a screenshot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $env:FC_LAUNCHER_HOME = "$env:RUNNER_TEMP\fc-app"
          $app = Start-Process -PassThru dist\FreedomClient-Launcher-Portable.exe
          Start-Sleep -Seconds 15
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save("shots\launcher-windows.png")
          # Memoria que usa el launcher (su proceso y los de WebView2).
          $procs = Get-Process FreedomClient-Launcher-Portable, msedgewebview2 -ErrorAction SilentlyContinue
          $total = [math]::Round(($procs | Measure-Object WorkingSet64 -Sum).Sum / 1MB)
          ($procs | Select-Object Name, Id, @{n="MB";e={[math]::Round($_.WorkingSet64 / 1MB)}} | Format-Table | Out-String) + "Total: $total MB" | Set-Content shots\launcher-process.txt
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
      - name: Install and start the game on Windows
        # Los runners de Windows no tienen OpenGL: se comprueba la instalación y que Fabric carga los mods.
        shell: bash
        working-directory: launcher
        env:
          FC_LAUNCHER_HOME: ${{ runner.temp }}/fc
          FC_CI_UNTIL: "Loading"
        run: |
          set -o pipefail
          cargo build -p fc-core --bin fc-ci
          ./target/debug/fc-ci 600 2>&1 | tee ../shots/fc-ci-windows.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test
          path: shots

  results:
    needs: [launch-test, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-test
          path: /tmp/shots/linux
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: windows-test
          path: /tmp/shots/windows
        continue-on-error: true
      - name: Publish results branch
        run: |
          mkdir -p /tmp/shots && cd /tmp/shots
          git init -q -b ci-launcher
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Launcher test from ${GITHUB_SHA} (${GITHUB_REF_NAME}): linux ${{ needs.launch-test.result }}, windows ${{ needs.windows.result }}" > README.md
          git add -A
          git commit -q -m "Launcher test from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-launcher
