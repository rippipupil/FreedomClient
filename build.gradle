plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base {
	archivesName = project.archives_base_name
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// Fabric API va incluido para que solo haga falta instalar Fabric Loader y FreedomClient.
	include(modImplementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"))

	// Mods de rendimiento que van dentro del .jar del cliente (Jar-in-Jar).
	include(modImplementation("maven.modrinth:sodium:${project.sodium_version}"))
	include(modImplementation("maven.modrinth:lithium:${project.lithium_version}"))
	include(modImplementation("maven.modrinth:ferrite-core:${project.ferritecore_version}"))
	include(modImplementation("maven.modrinth:immediatelyfast:${project.immediatelyfast_version}"))
	include(modImplementation("maven.modrinth:dynamic-fps:${project.dynamicfps_version}"))
}

// Tests de cliente: abren el juego, el menú y hacen capturas (ver .github/workflows/screenshots.yml).
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "freedomclient-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

jar {
	from("THIRD_PARTY_NOTICES.md")
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
