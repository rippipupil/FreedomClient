plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base {
	archivesName = project.archives_base_name
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	mavenCentral()
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// Fabric API va incluido para que solo haga falta instalar Fabric Loader y FreedomClient.
	include(modImplementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"))

	// Mods de rendimiento que van dentro del .jar del cliente (Jar-in-Jar).
	include(modImplementation("maven.modrinth:sodium:${project.sodium_version}"))
	include(modImplementation("maven.modrinth:lithium:${project.lithium_version}"))
	include(modImplementation("maven.modrinth:ferrite-core:${project.ferritecore_version}"))
	include(modImplementation("maven.modrinth:immediatelyfast:${project.immediatelyfast_version}"))
	include(modImplementation("maven.modrinth:dynamic-fps:${project.dynamicfps_version}"))

	// Mods de utilidad y visuales incluidos (sus licencias permiten redistribuirlos, ver THIRD_PARTY_NOTICES.md).
	include(modImplementation("maven.modrinth:continuity:${project.continuity_version}"))
	include(modImplementation("maven.modrinth:debugify:${project.debugify_version}"))
	include(modImplementation("maven.modrinth:yacl:${project.yacl_version}"))
	include(modImplementation("maven.modrinth:mouse-tweaks:${project.mousetweaks_version}"))
	include(modImplementation("maven.modrinth:fast-ip-ping:${project.fastipping_version}"))

	// Decodificador de MP3 en Java puro (LGPL) para el reproductor de música local.
	include(implementation("javazoom:jlayer:1.0.1"))

	// El paquete de Fabric API no incluye la API de tests de cliente; solo se añade al ejecutar los tests.
	productionRuntimeMods fabricApi.module("fabric-client-gametest-api-v1", project.fabric_api_version)
}

// Tests de cliente: abren el juego, el menú y hacen capturas (ver .github/workflows/screenshots.yml).
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "freedomclient-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// Ejecuta los tests de cliente con el .jar real que se distribuye (con todos los mods incluidos dentro),
// en vez de con el entorno de desarrollo. Así se prueba exactamente lo que instala el jugador.
def gametestJar = tasks.register("gametestJar", Jar) {
	from sourceSets.gametest.output
	archiveClassifier = "gametest-dev"
}

def remapGametestJar = tasks.register("remapGametestJar", net.fabricmc.loom.task.RemapJarTask) {
	inputFile = gametestJar.flatMap { it.archiveFile }
	archiveClassifier = "gametest"
	addNestedDependencies = false
}

tasks.register("runProductionClientGameTest", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	mods.from(remapGametestJar)
	jvmArgs.add("-Dfabric.client.gametest")
	jvmArgs.add("-Dfabric.client.gametest.disableNetworkSynchronizer=true")
	useXVFB = true
}

// Commit con el que se compila, para el avisador de actualizaciones (en GitHub Actions viene en GITHUB_SHA).
def buildCommit = System.getenv("GITHUB_SHA") ?: providers.exec {
	commandLine "git", "rev-parse", "HEAD"
	ignoreExitValue = true
}.standardOutput.asText.getOrElse("").trim()

processResources {
	def version = project.version
	inputs.property "version", version
	inputs.property "commit", buildCommit

	filesMatching("fabric.mod.json") {
		expand "version": version, "commit": buildCommit
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

jar {
	from("THIRD_PARTY_NOTICES.md")
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
